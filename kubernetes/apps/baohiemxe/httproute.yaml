# HTTPRoute that wires baohiemxe.com / www.baohiemxe.com → baohiemxe Service.
# Attaches to the main-gateway listeners we added in gateway-listeners.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: baohiemxe-route
  namespace: baohiemxe
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https-baohiemxe
    - name: main-gateway
      namespace: ingress
      sectionName: https-baohiemxe-www
    - name: main-gateway
      namespace: ingress
      sectionName: http-baohiemxe
    - name: main-gateway
      namespace: ingress
      sectionName: http-baohiemxe-www
    - name: main-gateway
      namespace: ingress
      sectionName: https-baohiemxe-origin-east
    - name: main-gateway
      namespace: ingress
      sectionName: http-baohiemxe-origin-east
  hostnames:
    - baohiemxe.com
    - www.baohiemxe.com
    # Direct name for this origin, used by the edge Worker that picks between
    # origins. Serves identical content; never advertised publicly.
    - origin-east.baohiemxe.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Which origin served this response. baohiemxe.com now has two proxied
        # A records, so without this you cannot tell which cluster answered,
        # and you cannot confirm failover actually happened during an incident.
        # Cheap, safe, and does not affect caching.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Served-By
                value: east
      backendRefs:
        - name: baohiemxe
          port: 80
